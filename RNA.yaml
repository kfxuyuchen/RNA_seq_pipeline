# RNA-seq conda environment — dual pipeline (StringTie + featureCounts)
# 用途: HISAT2 比对 → StringTie 和/或 featureCounts → count/TPM/FPKM
# 配套脚本: /public/home/xuyuchen/local/RNA_seq_pipeline/
#   RNA_seq_run_dual.sh | map_only.sh | post_stringtie.sh | post_featurecounts.sh
#
# 重建环境（推荐）:
#   mamba env create -f RNA.yaml
#   # 或更新已有:
#   mamba env update -n RNA-seq -f RNA.yaml --prune
#
# 激活后自检:
#   conda activate RNA-seq
#   hisat2 --version; stringtie --version; samtools --version
#   featureCounts -v; gffread --version; python3 --version
#
# 注意:
#   1) getTPM.py / getFPKM.py / prepDE.py 仍需系统 python2（python2 --version）
#      迁移机器若无 python2，请另行安装或只用 featureCounts 路线（python3）
#   2) 本文件按当前机器 RNA-seq 环境导出并补全 dual 依赖；跨架构可去掉 build 串再装
#
name: RNA-seq
channels:
  - bioconda
  - conda-forge
  - defaults
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/bioconda
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/free
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/r
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/msys2

dependencies:
  # ---------- 核心分析工具（dual pipeline 必需）----------
  - hisat2=2.2.1=h87f3376_4          # 比对（脚本使用 --dta --mm）
  - stringtie=2.1.7=h978d192_0       # 路径 A：参考引导定量
  - subread=2.1.1=h577a1d6_0         # 路径 B：featureCounts
  - samtools=1.5=1                   # BAM 处理（环境内版本；勿被 PATH 其它 samtools 覆盖）
  - htslib=1.8=1
  - gffread=0.12.7                   # GFF3→GTF（featureCounts 注释）
  - python=3.11.3=h7a1cb2a_0         # counts_to_fpkm_tpm.py / 通用
  - pip=23.2.1=py311h06a4308_0
  - setuptools=68.0.0=py311h06a4308_0
  - wheel=0.38.4=py311h06a4308_0

  # ---------- 历史/辅助工具（原环境保留，转移时一并复现）----------
  - bowtie=1.0.0=1
  - trimmomatic=0.39=hdfd78af_2
  - trinity=2.1.1=6
  - jellyfish=2.2.10=h6bb024c_1
  - parafly=r2013_01_21=0
  - fastool=0.1.4=h577a1d6_10
  - slclust=02022010=1
  - collectl=4.0.4=1
  - java-jdk=7.0.91=1
  - openjdk=8.0.121=1
  - perl=5.34.0=h5eee18b_2
  - perl-threaded=5.32.1=hdfd78af_1

  # ---------- 系统/库依赖（与当前 env 一致）----------
  - _libgcc_mutex=0.1=main
  - _openmp_mutex=5.1=1_gnu
  - bzip2=1.0.8=h7b6447c_0
  - c-ares=1.19.0=h5eee18b_0
  - ca-certificates=2023.12.12=h06a4308_0
  - curl=7.26.0=1
  - gdbm=1.18=hd4cb3f1_4
  - jemalloc=4.5.0.post=0
  - krb5=1.20.1=h568e23c_1
  - ld_impl_linux-64=2.38=h1181459_1
  - libcurl=7.88.1=h91b91d3_2
  - libdeflate=1.17=h5eee18b_0
  - libedit=3.1.20221030=h5eee18b_0
  - libev=4.33=h7f8727e_1
  - libffi=3.4.4=h6a678d5_0
  - libgcc=15.2.0=h69a1729_8
  - libgcc-ng=15.2.0=h166f726_8
  - libgomp=15.2.0=h4751f2c_8
  - libnghttp2=1.52.0=ha637b67_1
  - libssh2=1.10.0=h37d81fd_2
  - libstdcxx-ng=11.2.0=h1234567_1
  - libuuid=1.41.5=h5eee18b_0
  - libzlib=1.3.2=h47b2149_0
  - ncurses=6.4=h6a678d5_0
  - openssl=1.1.1w=h7f8727e_0
  - readline=8.2=h5eee18b_0
  - sqlite=3.41.2=h5eee18b_0
  - tk=8.6.12=h1ccaba5_0
  - tzdata=2023c=h04d1e81_0
  - xz=5.2.10=h5eee18b_1
  - zlib=1.3.2=h47b2149_0

prefix: /public/home/xuyuchen/miniconda3/envs/RNA-seq
